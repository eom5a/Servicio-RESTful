<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flightloom — Calendario de vuelos baratos</title>
  <meta name="impact-site-verification" value="ed1825ec-2f83-42dd-9ed4-292de358c1e4">
  <link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body class="bg-slate-50 min-h-screen">
  <header id="app-header" class="bg-white shadow-sm sticky top-0 z-10"></header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <section class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold text-slate-800 mb-2">
        Encuentra el día más barato para volar
      </h1>
      <p class="text-slate-500">
        Elige un origen y un mes: verás de un vistazo qué días son más baratos, sin ir probando fecha a fecha.
      </p>
    </section>

    <form id="calendar-form" class="bg-white rounded-2xl shadow-sm p-5 mb-8 grid gap-4 sm:grid-cols-4">
      <div class="sm:col-span-1">
        <label class="block text-sm font-medium text-slate-600 mb-1" for="origin">Origen</label>
        <input id="origin" list="origin-list" required placeholder="MAD"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
        <datalist id="origin-list"></datalist>
      </div>
      <div class="sm:col-span-1">
        <label class="block text-sm font-medium text-slate-600 mb-1" for="destination">
          Destino <span class="text-slate-400 font-normal">(opcional)</span>
        </label>
        <input id="destination" list="destination-list" placeholder="Cualquiera"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
        <datalist id="destination-list"></datalist>
      </div>
      <div class="sm:col-span-1">
        <label class="block text-sm font-medium text-slate-600 mb-1" for="month">Mes</label>
        <input id="month" type="month" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
      </div>
      <div class="sm:col-span-1 flex items-end">
        <button type="submit"
                class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-lg px-4 py-2 transition-colors">
          Ver calendario
        </button>
      </div>
    </form>

    <div class="flex items-center justify-between mb-4">
      <button id="prev-month" type="button"
              class="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 disabled:opacity-40" disabled>
        ← Mes anterior
      </button>
      <h2 id="month-label" class="font-semibold text-slate-700"></h2>
      <button id="next-month" type="button"
              class="px-3 py-1.5 rounded-lg bg-white border border-slate-300 text-slate-600 hover:bg-slate-100 disabled:opacity-40" disabled>
        Mes siguiente →
      </button>
    </div>

    <div id="calendar-status" class="text-sm text-slate-500 mb-3"></div>
    <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 sm:gap-2"></div>

    <p class="text-xs text-slate-400 mt-6 text-center">
      Precios orientativos agregados por Travelpayouts. Al hacer clic en un día se abre la búsqueda real en Aviasales.
    </p>
  </main>

  <script type="module" src="/js/calendar.js"></script>
</body>
</html>
