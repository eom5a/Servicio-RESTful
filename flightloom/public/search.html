<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flightloom — Buscar vuelos</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body class="bg-slate-50 min-h-screen">
  <header id="app-header" class="bg-white/80 backdrop-blur-md border-b border-slate-100 sticky top-0 z-20"></header>

  <section class="relative overflow-hidden bg-gradient-to-br from-slate-800 via-slate-700 to-sky-700 text-white">
    <svg class="absolute inset-0 w-full h-full opacity-20 pointer-events-none" preserveAspectRatio="none" viewBox="0 0 800 300" fill="none">
      <path d="M-20 150 C 220 40, 440 260, 820 120" stroke="white" stroke-width="2" stroke-dasharray="7 11" />
    </svg>
    <div class="max-w-3xl mx-auto px-4 pt-12 pb-20 sm:pt-16 sm:pb-24 text-center relative">
      <h1 class="text-3xl sm:text-5xl font-extrabold tracking-tight mb-4">Buscar vuelos</h1>
      <p class="text-white/90 text-base sm:text-lg">
        Búsqueda tradicional con fechas fijas, para cuando ya sabes cuándo quieres volar.
      </p>
    </div>
  </section>

  <main class="max-w-3xl mx-auto px-4 -mt-12 sm:-mt-14 pb-10 relative z-10">
    <form id="search-form" class="bg-white rounded-2xl shadow-xl shadow-slate-900/10 p-5 grid gap-4 sm:grid-cols-2">
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1" for="origin">Origen</label>
        <input id="origin" list="origin-list" required placeholder="MAD"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
        <datalist id="origin-list"></datalist>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1" for="destination">Destino</label>
        <input id="destination" list="destination-list" required placeholder="NRT"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
        <datalist id="destination-list"></datalist>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1" for="depart-date">Fecha de ida</label>
        <input id="depart-date" type="date" required
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1" for="return-date">
          Fecha de vuelta <span class="text-slate-400 font-normal">(opcional)</span>
        </label>
        <input id="return-date" type="date"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-600 mb-1" for="adults">Pasajeros</label>
        <input id="adults" type="number" min="1" max="9" value="1"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
      </div>
      <div class="sm:col-span-2">
        <button type="submit"
                class="w-full bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-lg px-4 py-2 transition-colors shadow-sm">
          Buscar vuelos
        </button>
      </div>
    </form>

    <div id="search-status" class="text-sm text-slate-500 mt-4 text-center"></div>
    <div id="alt-links" class="mt-5"></div>
  </main>

  <footer id="app-footer"></footer>

  <script type="module" src="/js/search.js"></script>
</body>
</html>
