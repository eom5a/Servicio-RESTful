services:
  app:
    build: .
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Local Postgres (see the `db` service below). Photo storage still requires a
      # real Vercel Blob store + BLOB_READ_WRITE_TOKEN in .env — Blob is a hosted
      # service, not something this compose file can provide locally.
      DATABASE_URL: "postgresql://nutrition:nutrition@db:5432/nutrition?schema=public"
      DATABASE_URL_UNPOOLED: "postgresql://nutrition:nutrition@db:5432/nutrition?schema=public"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nutrition
      POSTGRES_PASSWORD: nutrition
      POSTGRES_DB: nutrition
    volumes:
      - nutrition_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutrition"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  nutrition_db:
