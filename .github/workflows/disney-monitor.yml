name: disney-monitor

on:
  schedule:
    # Cada 5 min de 05:00 a 21:59 UTC (07:00-23:59 en París en verano, 06:00-22:59 en invierno).
    - cron: "*/5 5-21 * * *"
  workflow_dispatch:
    inputs:
      test:
        description: "Enviar solo un aviso de prueba"
        type: boolean
        default: false
      minutes:
        description: "Minutos de vigilancia continua (máx. 340). Vacío = 4,5 min"
        type: string
        default: ""

concurrency:
  group: disney-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.minutes && 355 || 7 }}
    env:
      CALLMEBOT_PHONE: ${{ secrets.CALLMEBOT_PHONE }}
      CALLMEBOT_APIKEY: ${{ secrets.CALLMEBOT_APIKEY }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4

      - name: Aviso de prueba
        if: ${{ inputs.test }}
        run: python3 disney-monitor/monitor.py --test

      - name: Restaurar estado anterior
        if: ${{ !inputs.test }}
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: disney-state-${{ github.run_id }}
          restore-keys: disney-state-

      - name: Vigilar colas
        if: ${{ !inputs.test }}
        env:
          MINUTES: ${{ inputs.minutes }}
        run: |
          MINUTES="${MINUTES:-0}"
          if ! [[ "$MINUTES" =~ ^[0-9]+$ ]] || [ "$MINUTES" -gt 340 ]; then
            echo "minutes debe ser un entero entre 0 y 340"; exit 1
          fi
          DURATION=$(( MINUTES > 0 ? MINUTES * 60 : 270 ))
          python3 disney-monitor/monitor.py --duration "$DURATION" --interval 20 --state state.json

      - name: Guardar estado
        if: ${{ !inputs.test && always() }}
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: disney-state-${{ github.run_id }}
