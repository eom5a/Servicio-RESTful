<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FlightCalendar — Explorar destinos baratos</title>
  <link rel="stylesheet" href="/css/tailwind.css" />
</head>
<body class="bg-slate-50 min-h-screen">
  <header id="app-header" class="bg-white shadow-sm sticky top-0 z-10"></header>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <section class="text-center mb-8">
      <h1 class="text-3xl sm:text-4xl font-bold text-slate-800 mb-2">
        ¿A dónde puedo volar barato?
      </h1>
      <p class="text-slate-500">
        Fija tu origen y descubre los destinos más baratos encontrados, sin elegir destino de antemano.
      </p>
    </section>

    <form id="explorer-form" class="bg-white rounded-2xl shadow-sm p-5 mb-8 grid gap-4 sm:grid-cols-3">
      <div class="sm:col-span-2">
        <label class="block text-sm font-medium text-slate-600 mb-1" for="origin">Origen</label>
        <input id="origin" list="origin-list" required placeholder="MAD"
               class="w-full rounded-lg border border-slate-300 px-3 py-2 focus:outline-none focus:ring-2 focus:ring-sky-500" />
        <datalist id="origin-list"></datalist>
      </div>
      <div class="flex items-end">
        <button type="submit"
                class="w-full bg-sky-600 hover:bg-sky-700 text-white font-semibold rounded-lg px-4 py-2 transition-colors">
          Explorar destinos
        </button>
      </div>
    </form>

    <div id="explorer-status" class="text-sm text-slate-500 mb-3"></div>
    <div id="explorer-results" class="grid gap-3 sm:grid-cols-2 lg:grid-cols-3"></div>
  </main>

  <script type="module" src="/js/explorer.js"></script>
</body>
</html>
